<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier - Branch Queue</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="mini-header">
            <a href="index.html" class="home-icon">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <h1>Cashier Console</h1>
            <a href="index.html" class="home-icon">
                <i class="fas fa-home"></i>
            </a>
        </header>

        <div class="content">
            <button id="openQueueBtn" class="btn btn-primary">Direct Branch Transactions Queue</button>

            <div id="queueSection" style="display:none; margin-top:20px;">
                <!-- Two main tabs: Tokens and Audit (customer-like style) -->
                <div class="tabs">
                    <button class="tab-button active" data-tab="tokens-tab">Tokens</button>
                    <button class="tab-button" data-tab="audit-tab">Audit</button>
                </div>

                <div id="tokens-tab" class="tab-content active">
                    <h2>Pending Tokens</h2>
                    <div id="tokensList"></div>
                </div>

                <div id="audit-tab" class="tab-content">
                    <h2>Audit</h2>
                    <div id="auditReport"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for processing token -->
    <div id="processModal" class="popup" style="display:none;">
        <div class="popup-content">
            <h2 id="procTitle">Process Transaction</h2>
            <div id="procDetails"></div>
            <div style="margin-top:12px;">
                <button id="sendSmsBtn" class="btn btn-secondary">Send SMS</button>
                <button id="sendEmailBtn" class="btn btn-secondary">Send Email</button>
                <button id="authorizeBtn" class="btn btn-primary">Authorise and Close</button>
            </div>
            <button id="closeProcBtn" class="btn" style="margin-top:8px;">Close</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/cashier.js"></script>
</body>
</html>
