<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Banking App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
                <h2>ABC MOBILE BANKING</h2>
            </div>
        <div class="login-form">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="role">Your Role:</label>
                    <select id="role" name="role">
                        <option value="customer" selected>Customer</option>
                        <option value="cashier">Cashier</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="username">Username (enter yourname)</label>
                    <input type="text" id="username" name="username" placeholder="yourname" required>
                </div>
                <div class="form-group">
                    <label for="password">Password (enter yourname)</label>
                    <input type="password" id="password" name="password" placeholder="yourname" required>
                </div>
                <button type="submit" id="loginButton">Login</button>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
